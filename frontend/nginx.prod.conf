# ─────────────────────────────────────────────────────────────────────────────
# Mokku Journey DevOps — production nginx (EC2).
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.
# Serves the static frontend at / and proxies /api/* to the FastAPI backend,
# so the whole app works over ONE public URL (port 80).
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend (vanilla HTML/CSS/JS — no build step).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy → FastAPI backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Light caching for the illustration assets.
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
