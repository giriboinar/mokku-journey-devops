# ─────────────────────────────────────────────────────────────────────────────
# Mokku Journey DevOps — Prometheus scrape config (production EC2 stack).
# Referenced by docker-compose.prod.yml as /etc/prometheus/prometheus.yml.
# ─────────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI backend — metrics exposed at /metrics by
  # prometheus-fastapi-instrumentator (see backend/app/main.py).
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
