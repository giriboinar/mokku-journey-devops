<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/>
      <stop offset="1" stop-color="#12294f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#d99a1f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f5c542"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7bc96f"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" rx="16"/>

  <text x="640" y="48" text-anchor="middle" fill="#f5c542" font-size="30" font-weight="700">
    Raja's Mokku Journey — DevOps Architecture
  </text>
  <text x="640" y="74" text-anchor="middle" fill="#9db2d6" font-size="14">
    Tirumala Tirupati Venkateswara Swamy — From Muddanur to Tirumala
  </text>

  <!-- Main pipeline boxes -->
  <g font-size="14" font-weight="600">
    <!-- Developer -->
    <rect x="30" y="180" width="120" height="90" rx="12" fill="#1d3a68" stroke="#f5c542" stroke-width="2"/>
    <text x="90" y="215" text-anchor="middle" fill="#ffffff">👩‍💻</text>
    <text x="90" y="240" text-anchor="middle" fill="#ffffff">Developer</text>
    <text x="90" y="258" text-anchor="middle" fill="#9db2d6" font-size="11" font-weight="400">git push</text>

    <!-- GitHub -->
    <rect x="200" y="180" width="120" height="90" rx="12" fill="#1d3a68" stroke="#f5c542" stroke-width="2"/>
    <text x="260" y="215" text-anchor="middle" fill="#ffffff">🐙</text>
    <text x="260" y="240" text-anchor="middle" fill="#ffffff">GitHub</text>
    <text x="260" y="258" text-anchor="middle" fill="#9db2d6" font-size="11" font-weight="400">Actions CI</text>

    <!-- CI Pipeline -->
    <rect x="370" y="180" width="130" height="90" rx="12" fill="#1d3a68" stroke="#f5c542" stroke-width="2"/>
    <text x="435" y="215" text-anchor="middle" fill="#ffffff">⚙️</text>
    <text x="435" y="240" text-anchor="middle" fill="#ffffff">CI Pipeline</text>
    <text x="435" y="258" text-anchor="middle" fill="#9db2d6" font-size="11" font-weight="400">Jenkins + Actions</text>

    <!-- Tests -->
    <rect x="550" y="180" width="130" height="90" rx="12" fill="#1d3a68" stroke="#7bc96f" stroke-width="2"/>
    <text x="615" y="215" text-anchor="middle" fill="#ffffff">🧪</text>
    <text x="615" y="240" text-anchor="middle" fill="#ffffff">Tests &amp; Scans</text>
    <text x="615" y="258" text-anchor="middle" fill="#9db2d6" font-size="11" font-weight="400">pytest · Trivy</text>

    <!-- Docker -->
    <rect x="730" y="180" width="120" height="90" rx="12" fill="#1d3a68" stroke="#f5c542" stroke-width="2"/>
    <text x="790" y="215" text-anchor="middle" fill="#ffffff">🐳</text>
    <text x="790" y="240" text-anchor="middle" fill="#ffffff">Docker Image</text>
    <text x="790" y="258" text-anchor="middle" fill="#9db2d6" font-size="11" font-weight="400">multi-stage</text>

    <!-- ECR -->
    <rect x="900" y="180" width="120" height="90" rx="12" fill="#1d3a68" stroke="#f5c542" stroke-width="2"/>
    <text x="960" y="215" text-anchor="middle" fill="#ffffff">📦</text>
    <text x="960" y="240" text-anchor="middle" fill="#ffffff">Amazon ECR</text>
    <text x="960" y="258" text-anchor="middle" fill="#9db2d6" font-size="11" font-weight="400">scan-on-push</text>

    <!-- EKS -->
    <rect x="1070" y="180" width="120" height="90" rx="12" fill="#1d3a68" stroke="#f5c542" stroke-width="2"/>
    <text x="1130" y="215" text-anchor="middle" fill="#ffffff">☸️</text>
    <text x="1130" y="240" text-anchor="middle" fill="#ffffff">Amazon EKS</text>
    <text x="1130" y="258" text-anchor="middle" fill="#9db2d6" font-size="11" font-weight="400">Helm deploy</text>
  </g>

  <!-- Main flow arrows -->
  <g stroke="#f5c542" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="150" y1="225" x2="196" y2="225"/>
    <line x1="320" y1="225" x2="366" y2="225"/>
    <line x1="500" y1="225" x2="546" y2="225"/>
    <line x1="680" y1="225" x2="726" y2="225"/>
    <line x1="850" y1="225" x2="896" y2="225"/>
    <line x1="1020" y1="225" x2="1066" y2="225"/>
  </g>

  <!-- Second row: Load Balancer -> Website -->
  <g font-size="14" font-weight="600">
    <rect x="900" y="360" width="120" height="90" rx="12" fill="#1d3a68" stroke="#f5c542" stroke-width="2"/>
    <text x="960" y="395" text-anchor="middle" fill="#ffffff">🔀</text>
    <text x="960" y="420" text-anchor="middle" fill="#ffffff">Load Balancer</text>
    <text x="960" y="438" text-anchor="middle" fill="#9db2d6" font-size="11" font-weight="400">ALB · TLS</text>

    <rect x="1070" y="360" width="150" height="90" rx="12" fill="url(#gold)" stroke="#ffffff" stroke-width="2"/>
    <text x="1145" y="395" text-anchor="middle" fill="#0b1e3a">🛕</text>
    <text x="1145" y="420" text-anchor="middle" fill="#0b1e3a">Raja's Journey</text>
    <text x="1145" y="438" text-anchor="middle" fill="#0b1e3a" font-size="11" font-weight="400">Website · 16 stages</text>
  </g>
  <g stroke="#f5c542" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 1130 270 L 1130 330 L 1020 330 L 1020 360"/>
    <line x1="1020" y1="405" x2="1066" y2="405"/>
  </g>

  <!-- Side annotations -->
  <g font-size="13">
    <!-- Terraform box -->
    <rect x="30" y="360" width="220" height="130" rx="12" fill="#123322" stroke="#7bc96f" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="140" y="388" text-anchor="middle" fill="#7bc96f" font-weight="700">Terraform-managed infra</text>
    <text x="140" y="412" text-anchor="middle" fill="#d7e3f5" font-size="12">VPC · 2 AZs · NAT GW</text>
    <text x="140" y="432" text-anchor="middle" fill="#d7e3f5" font-size="12">EKS · ECR · ALB controller</text>
    <text x="140" y="452" text-anchor="middle" fill="#d7e3f5" font-size="12">CloudWatch · S3 state (encrypted)</text>
    <text x="140" y="472" text-anchor="middle" fill="#d7e3f5" font-size="12">dev / staging / production</text>

    <!-- IAM/OIDC box -->
    <rect x="280" y="360" width="220" height="130" rx="12" fill="#3a2a10" stroke="#f5c542" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="390" y="388" text-anchor="middle" fill="#f5c542" font-weight="700">IAM · OIDC (no keys)</text>
    <text x="390" y="412" text-anchor="middle" fill="#d7e3f5" font-size="12">GitHub Actions OIDC role</text>
    <text x="390" y="432" text-anchor="middle" fill="#d7e3f5" font-size="12">Jenkins deploy role</text>
    <text x="390" y="452" text-anchor="middle" fill="#d7e3f5" font-size="12">IRSA for pods</text>
    <text x="390" y="472" text-anchor="middle" fill="#d7e3f5" font-size="12">Secrets Manager</text>

    <!-- Monitoring box -->
    <rect x="530" y="360" width="220" height="130" rx="12" fill="#1d3a68" stroke="#9db2d6" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="640" y="388" text-anchor="middle" fill="#9db2d6" font-weight="700">Monitoring</text>
    <text x="640" y="412" text-anchor="middle" fill="#d7e3f5" font-size="12">CloudWatch dashboards</text>
    <text x="640" y="432" text-anchor="middle" fill="#d7e3f5" font-size="12">5xx · CPU · memory alarms</text>
    <text x="640" y="452" text-anchor="middle" fill="#d7e3f5" font-size="12">HPA · probes · PDB</text>
    <text x="640" y="472" text-anchor="middle" fill="#d7e3f5" font-size="12">helm rollback on failure</text>
  </g>
  <g stroke="#7bc96f" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowGreen)">
    <path d="M 140 360 L 140 300 L 960 300 L 960 356"/>
    <path d="M 390 360 L 390 320 L 700 320"/>
  </g>

  <!-- Approval gate note -->
  <g font-size="13">
    <rect x="370" y="540" width="540" height="120" rx="12" fill="#1d3a68" stroke="#f5c542" stroke-width="1.5"/>
    <text x="640" y="568" text-anchor="middle" fill="#f5c542" font-weight="700">Deployment safety gates</text>
    <text x="640" y="594" text-anchor="middle" fill="#d7e3f5" font-size="12">Staging deploys automatically on push to main · smoke tests run</text>
    <text x="640" y="614" text-anchor="middle" fill="#d7e3f5" font-size="12">Production requires manual approval (Jenkins input / GitHub environment)</text>
    <text x="640" y="634" text-anchor="middle" fill="#d7e3f5" font-size="12">Failed verification → automatic helm rollback</text>
  </g>

  <text x="640" y="700" text-anchor="middle" fill="#5f7398" font-size="12">
    Govinda Govinda! 🙏 · B.Tech Dream Achieved · Mokku Fulfilled
  </text>
</svg>
