# ─────────────────────────────────────────────────────────────────────────────
# CI — build, lint, test, and security scans on every push / PR
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # for uploading Trivy SARIF results

env:
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "21"

jobs:
  python:
    name: Python — lint, tests, SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff bandit pip-audit

      - name: Ruff lint
        run: ruff check backend/

      - name: Bandit SAST
        run: bandit -q -r backend/app -x backend/tests || true

      - name: pip-audit dependency scan
        run: pip-audit -r backend/requirements.txt || true

      - name: Pytest
        run: pytest backend/tests -v --cov=backend/app --cov-report=term-missing --cov-fail-under=70

  java:
    name: Java — Maven build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven verify
        working-directory: java-service
        run: mvn -B clean verify

  docker:
    name: Docker — build, hadolint, Trivy
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Build backend image
        run: docker build -t raja-journey-backend:ci -f backend/Dockerfile backend/

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: raja-journey-backend:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  helm:
    name: Helm — lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Helm lint
        run: helm lint helm/raja-journey -f helm/raja-journey/values-staging.yaml

      - name: Helm template (staging values)
        run: helm template raja-journey helm/raja-journey -f helm/raja-journey/values-staging.yaml --namespace raja-journey-staging | head -50

      - name: kubeconform validate
        uses: instrumenta/kubeconform-action@v0.0.1
        with:
          files: k8s/

  terraform-validate:
    name: Terraform — fmt & validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: terraform init (backend disabled) & validate
        working-directory: terraform/environments/${{ matrix.env }}
        run: |
          terraform init -backend=false
          terraform validate
