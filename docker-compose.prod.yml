# ─────────────────────────────────────────────────────────────────────────────
# Mokku Journey DevOps — production stack for AWS Free Tier EC2 (t3.micro).
#
# Lean by design: no java-service (t3.micro has 1 GB RAM). One public port
# (80): nginx serves the static frontend and proxies /api/* to the backend.
#
#   docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────
name: mokku-journey-prod

services:
  backend:
    build: ./backend
    image: mokku-journey-backend:prod
    container_name: mokku-journey-backend
    environment:
      APP_ENV: prod
      APP_NAME: mokku-journey-devops
      # No CORS_ORIGINS here on purpose: in production nginx serves the
      # frontend and proxies /api from the same origin, so browsers never
      # make cross-origin requests. Set CORS_ORIGINS explicitly only if you
      # serve the frontend from a different domain.
    expose:
      - "8000"   # internal only — reached via the nginx /api proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [mj-prod]

  # Static frontend + reverse proxy for /api → backend:8000
  frontend:
    image: nginx:1.27-alpine
    container_name: mokku-journey-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [mj-prod]

  # NOTE: ports 9090 (Prometheus), 3000 (Grafana) and 9100 (node-exporter)
  # are published here, but the AWS security group only opens them to
  # var.monitoring_cidr (set it to YOUR IP — never 0.0.0.0/0). The app
  # itself only needs port 80 public.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mokku-journey-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"   # small disk footprint for t3.micro
    restart: unless-stopped
    networks: [mj-prod]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mokku-journey-grafana
    ports:
      - "3000:3000"
    environment:
      # Admin password comes from .env (see .env.example). The :?
      # makes compose fail fast with a clear message if it is unset.
      # No default is baked in — a public default password is how
      # dashboards get hijacked.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your .env file (see .env.example)}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [mj-prod]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: mokku-journey-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks: [mj-prod]

networks:
  mj-prod:
    driver: bridge

volumes:
  grafana-data:

