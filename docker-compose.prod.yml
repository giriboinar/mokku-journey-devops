# ─────────────────────────────────────────────────────────────────────────────
# Mokku Journey DevOps — production stack for AWS Free Tier EC2 (t3.micro).
#
# Lean by design: no java-service (t3.micro has 1 GB RAM). One public port
# (80): nginx serves the static frontend and proxies /api/* to the backend.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   GRAFANA_PASSWORD=changeme docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────
name: mokku-journey-prod

services:
  backend:
    build: ./backend
    image: mokku-journey-backend:prod
    container_name: mokku-journey-backend
    environment:
      APP_ENV: prod
      APP_NAME: mokku-journey-devops
      # NOTE: the backend currently allows all CORS origins (see backend/app/main.py).
      # Passed here for documentation/future use.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    expose:
      - "8000"   # internal only — reached via the nginx /api proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [mj-prod]

  # Static frontend + reverse proxy for /api → backend:8000
  frontend:
    image: nginx:1.27-alpine
    container_name: mokku-journey-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [mj-prod]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mokku-journey-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"   # small disk footprint for t3.micro
    restart: unless-stopped
    networks: [mj-prod]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mokku-journey-grafana
    ports:
      - "3000:3000"
    environment:
      # CHANGE THIS on first boot: GRAFANA_PASSWORD=<strong> docker compose ...
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [mj-prod]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: mokku-journey-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks: [mj-prod]

networks:
  mj-prod:
    driver: bridge

volumes:
  grafana-data:
