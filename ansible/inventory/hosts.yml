# ─────────────────────────────────────────────────────────────────────────────
# Mokku Journey DevOps — Ansible inventory.
#
# Fill in your EC2 Elastic IP (from `terraform -chdir=terraform/free-tier output
# public_ip`) and the path to your EC2 .pem key, then run:
#
#   ansible-playbook -i inventory/hosts.yml playbook.yml
#
# from the ansible/ directory.
# ─────────────────────────────────────────────────────────────────────────────
all:
  children:
    appservers:
      hosts:
        app1:
          ansible_host: REPLACE_WITH_EC2_IP        # e.g. 13.232.10.20
          ansible_user: ec2-user
          ansible_ssh_private_key_file: ~/.ssh/REPLACE.pem
